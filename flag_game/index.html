<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flag Master</title>
    <meta name="description" content="Test your knowledge of world flags in this premium quiz game.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- Main Menu -->
        <section id="menu-view" class="view active-view">
            <div class="content-box glass">
                <h1 class="title">Flag<span class="highlight">Master</span></h1>
                <h2 class="subtitle">Test your global knowledge</h2>

                <div class="difficulty-select">
                    <p class="instruction-text">Select Difficulty</p>
                    <div class="difficulty-btns">
                        <button class="btn secondary-btn" id="easy-btn" data-difficulty="easy">
                            Easy
                            <span class="btn-sub">Show On Map</span>
                        </button>
                        <button class="btn primary-btn" id="hard-btn" data-difficulty="hard">
                            Hard
                            <span class="btn-sub">Outline Only</span>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Game View -->
        <section id="game-view" class="view hidden">
            <header class="game-header">
                <div class="stat-box">
                    <span class="label">Score</span>
                    <span id="score-display" class="value">0</span>
                </div>
                <div class="timer-bar">
                    <div id="timer-fill" class="timer-fill"></div>
                </div>
                <div class="stat-box">
                    <span class="label">Time</span>
                    <span id="time-display" class="value">30</span>
                </div>
            </header>

            <div class="game-content">
                <div class="outline-container glass" id="question-container">
                    <!-- Content injected by JS: IMG (Hard) or SVG (Easy) -->
                </div>

                <h3 class="instruction-text">Which country is this?</h3>

                <div id="options-container" class="options-grid-flags">
                    <!-- Options injected by JS -->
                </div>
            </div>
        </section>

        <!-- Game Over View -->
        <section id="game-over-view" class="view hidden">
            <div class="content-box glass">
                <h2>Game Over</h2>
                <div class="final-score-box">
                    <span class="label">Final Score</span>
                    <span id="final-score" class="value big">0</span>
                </div>
                <p id="high-score-msg" class="hidden">New High Score!</p>
                <button id="restart-btn" class="btn primary-btn">Play Again</button>
            </div>
        </section>
    </div>

    <script src="app.js"></script>
</body>

</html>
